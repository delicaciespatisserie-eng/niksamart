<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Checkout - NiksaMart</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
  body { font-family: 'Inter', sans-serif; background: #f8f9fa; }
  .checkout-card { max-width: 500px; margin: 60px auto; background: #fff; border-radius: 16px; padding: 40px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); }
  .btn-pay { background: #000080; color: #fff; border: none; padding: 14px 32px; border-radius: 8px; font-weight: 700; width: 100%; font-size: 16px; cursor: pointer; transition: all 0.2s; }
  .btn-pay:hover { opacity: 0.9; transform: translateY(-2px); }
  .order-detail { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #eee; }
</style>
</head>
<body>
<div class="checkout-card text-center">
  <img src="images/logo.png" alt="NiksaMart" style="max-height: 40px; margin-bottom: 24px;">
  <h3 style="font-weight: 800; color: #000080;">Complete Payment</h3>
  <p style="color: #666; margin-bottom: 30px;">Secure payment via Razorpay</p>
  <div id="orderSummary"></div>
  <button class="btn-pay mt-4" id="payButton" onclick="initPayment()">Pay Now</button>
  <p style="font-size: 12px; color: #999; margin-top: 16px;">Secured by Razorpay | 256-bit SSL Encryption</p>
</div>
<script>
const params = new URLSearchParams(window.location.search);
const amount = params.get('amount');
const orderId = params.get('orderId');
const key = params.get('key') || 'rzp_live_YOUR_KEY';
if (amount) document.getElementById('orderSummary').innerHTML = '<div class="order-detail"><span>Order Total</span><strong>₹' + (Number(amount)/100).toLocaleString('en-IN') + '</strong></div>';
function initPayment() {
  const options = {
    key: key,
    amount: amount,
    currency: 'INR',
    name: 'NiksaMart',
    description: 'NiksaMart Order Payment',
    image: 'https://www.niksamart.com/images/logo.png',
    order_id: orderId,
    handler: function(response) {
      const token = localStorage.getItem('niksa_token');
      fetch('/api/orders/verify-payment', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({
          orderId: params.get('dbOrderId'),
          razorpay_order_id: response.razorpay_order_id,
          razorpay_payment_id: response.razorpay_payment_id,
          razorpay_signature: response.razorpay_signature
        })
      }).then(r => r.json()).then(data => {
        if (data.success) window.location.href = '/order-success/' + params.get('dbOrderId');
        else alert('Payment verification failed: ' + (data.message || 'Unknown error'));
      }).catch(e => alert('Payment verification failed'));
    },
    modal: { ondismiss: function() { alert('Payment cancelled. You can retry from your orders page.'); } }
  };
  const rzp = new Razorpay(options);
  rzp.open();
}
if (!amount || !orderId) document.getElementById('payButton').disabled = true;
</script>
</body>
</html>
